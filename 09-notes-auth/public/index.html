<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Private Notes & Blogs (JWT Auth)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <header class="bg-white border-b border-slate-200">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-4 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
      <div>
        <h1 class="text-xl font-bold text-slate-900">Private Notes &amp; Blogs</h1>
        <p class="text-sm text-slate-500">JWT + bcrypt authentication &bull; Strict per-user data isolation</p>
      </div>

      <div id="userBar" class="hidden flex items-center gap-3">
        <span class="text-sm text-slate-600">
          Signed in as <strong id="userNameLabel" class="text-slate-900"></strong>
          <span id="userEmailLabel" class="text-xs text-slate-400"></span>
        </span>
        <button
          type="button"
          id="logoutBtn"
          class="px-3.5 py-1.5 rounded-lg border border-slate-300 text-slate-700 hover:bg-slate-100 text-sm font-medium cursor-pointer"
        >
          Logout
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 sm:px-6 py-6">
    <!-- AUTHENTICATION VIEW -->
    <section id="authView" class="max-w-md mx-auto space-y-5">
      <div class="bg-white border border-slate-200 rounded-xl shadow-sm p-6">
        <div class="grid grid-cols-2 bg-slate-100 p-1 rounded-lg border border-slate-200 mb-5">
          <button
            type="button"
            id="modeLoginBtn"
            class="py-1.5 rounded-md text-sm font-medium bg-indigo-600 text-white cursor-pointer"
          >
            Login
          </button>
          <button
            type="button"
            id="modeSignupBtn"
            class="py-1.5 rounded-md text-sm font-medium text-slate-700 hover:text-slate-900 cursor-pointer"
          >
            Sign Up
          </button>
        </div>

        <div id="authAlert" class="hidden mb-4 rounded-lg px-3.5 py-2.5 text-sm border" role="alert"></div>

        <form id="authForm" class="space-y-3.5" novalidate>
          <div id="nameFieldGroup" class="hidden">
            <label for="authName" class="block text-sm font-medium text-slate-700 mb-1">Full Name</label>
            <input
              type="text"
              id="authName"
              placeholder="e.g. Rohan Kulkarni"
              class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
            />
          </div>

          <div>
            <label for="authEmail" class="block text-sm font-medium text-slate-700 mb-1">Email</label>
            <input
              type="email"
              id="authEmail"
              placeholder="e.g. aarav@college.edu"
              required
              class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
            />
          </div>

          <div>
            <label for="authPassword" class="block text-sm font-medium text-slate-700 mb-1">Password</label>
            <input
              type="password"
              id="authPassword"
              placeholder="Min 6 characters"
              required
              class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
            />
          </div>

          <button
            type="submit"
            id="authSubmitBtn"
            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm px-4 py-2.5 rounded-lg transition-colors cursor-pointer"
          >
            Login
          </button>
        </form>
      </div>

      <!-- Demo Account Quick-Fill Box -->
      <div class="bg-white border border-slate-200 rounded-xl shadow-sm p-4 text-xs text-slate-600 space-y-2">
        <p class="font-semibold text-slate-800">Seeded Demo Accounts (Password: <code class="px-1 py-0.5 bg-slate-100 rounded">pass123</code>)</p>
        <p>Log in as either user to verify each user only sees their own private notes:</p>
        <div class="flex flex-wrap gap-2 pt-1">
          <button
            type="button"
            data-demo-email="aarav@college.edu"
            class="px-2.5 py-1 rounded-md border border-indigo-200 bg-indigo-50 text-indigo-700 hover:bg-indigo-100 font-medium cursor-pointer"
          >
            Fill Aarav (aarav@college.edu)
          </button>
          <button
            type="button"
            data-demo-email="priya@college.edu"
            class="px-2.5 py-1 rounded-md border border-indigo-200 bg-indigo-50 text-indigo-700 hover:bg-indigo-100 font-medium cursor-pointer"
          >
            Fill Priya (priya@college.edu)
          </button>
        </div>
      </div>
    </section>

    <!-- NOTES WORKSPACE VIEW (LOGGED IN ONLY) -->
    <section id="notesView" class="hidden grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
      <!-- Create / Edit Note Form -->
      <div class="lg:col-span-4 bg-white border border-slate-200 rounded-xl shadow-sm p-5">
        <div class="flex items-center justify-between mb-4">
          <h2 id="noteFormTitle" class="text-base font-semibold text-slate-900">Create Note</h2>
          <span id="editBadge" class="hidden text-xs font-medium px-2.5 py-0.5 rounded-full bg-indigo-50 text-indigo-700 border border-indigo-200">
            Editing
          </span>
        </div>

        <div id="noteAlert" class="hidden mb-4 rounded-lg px-3.5 py-2.5 text-sm border" role="alert"></div>

        <form id="noteForm" class="space-y-3.5" novalidate>
          <input type="hidden" id="noteId" />

          <div>
            <label for="noteTitle" class="block text-sm font-medium text-slate-700 mb-1">Title</label>
            <input
              type="text"
              id="noteTitle"
              placeholder="e.g. Cloud Computing Summary"
              required
              class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
            />
          </div>

          <div>
            <label for="noteCategory" class="block text-sm font-medium text-slate-700 mb-1">Category / Tag</label>
            <input
              type="text"
              id="noteCategory"
              placeholder="e.g. Study, Blog, Personal"
              value="General"
              class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
            />
          </div>

          <div>
            <label for="noteContent" class="block text-sm font-medium text-slate-700 mb-1">Content</label>
            <textarea
              id="noteContent"
              rows="5"
              placeholder="Write your note or blog post here..."
              required
              class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
            ></textarea>
          </div>

          <div class="flex items-center gap-2">
            <button
              type="submit"
              id="saveNoteBtn"
              class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm px-4 py-2.5 rounded-lg transition-colors cursor-pointer"
            >
              Save Note
            </button>
            <button
              type="button"
              id="cancelEditBtn"
              class="hidden px-4 py-2.5 rounded-lg border border-slate-300 text-slate-700 hover:bg-slate-100 font-medium text-sm cursor-pointer"
            >
              Cancel
            </button>
          </div>
        </form>
      </div>

      <!-- User's Private Notes List -->
      <div class="lg:col-span-8 space-y-4">
        <div class="bg-white border border-slate-200 rounded-xl shadow-sm p-4 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
          <div>
            <h2 class="text-base font-semibold text-slate-900">Your Private Notes</h2>
            <p id="notesCountLabel" class="text-xs text-slate-500 mt-0.5">Loading your notes...</p>
          </div>
          <input
            type="search"
            id="searchInput"
            placeholder="Search your notes..."
            class="w-full sm:w-64 rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
          />
        </div>

        <div id="listAlert" class="hidden rounded-lg px-4 py-2.5 text-sm border" role="alert"></div>

        <div id="notesGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
      </div>
    </section>
  </main>

  <script>
    const TOKEN_KEY = 'notes_auth_jwt';

    const authView = document.getElementById('authView');
    const notesView = document.getElementById('notesView');
    const userBar = document.getElementById('userBar');
    const userNameLabel = document.getElementById('userNameLabel');
    const userEmailLabel = document.getElementById('userEmailLabel');
    const logoutBtn = document.getElementById('logoutBtn');

    const modeLoginBtn = document.getElementById('modeLoginBtn');
    const modeSignupBtn = document.getElementById('modeSignupBtn');
    const authForm = document.getElementById('authForm');
    const nameFieldGroup = document.getElementById('nameFieldGroup');
    const authNameInput = document.getElementById('authName');
    const authEmailInput = document.getElementById('authEmail');
    const authPasswordInput = document.getElementById('authPassword');
    const authSubmitBtn = document.getElementById('authSubmitBtn');
    const authAlert = document.getElementById('authAlert');

    const noteForm = document.getElementById('noteForm');
    const noteIdInput = document.getElementById('noteId');
    const noteTitleInput = document.getElementById('noteTitle');
    const noteCategoryInput = document.getElementById('noteCategory');
    const noteContentInput = document.getElementById('noteContent');
    const noteFormTitle = document.getElementById('noteFormTitle');
    const editBadge = document.getElementById('editBadge');
    const saveNoteBtn = document.getElementById('saveNoteBtn');
    const cancelEditBtn = document.getElementById('cancelEditBtn');
    const noteAlert = document.getElementById('noteAlert');

    const searchInput = document.getElementById('searchInput');
    const notesCountLabel = document.getElementById('notesCountLabel');
    const listAlert = document.getElementById('listAlert');
    const notesGrid = document.getElementById('notesGrid');

    let authMode = 'login';
    let currentNotes = [];
    let searchTimer = null;

    function escapeHtml(value) {
      const div = document.createElement('div');
      div.textContent = String(value ?? '');
      return div.innerHTML;
    }

    function showBanner(el, message, type = 'error') {
      el.textContent = message;
      el.className = 'mb-4 rounded-lg px-3.5 py-2.5 text-sm border ' + (
        type === 'success'
          ? 'bg-emerald-50 text-emerald-800 border-emerald-200'
          : 'bg-rose-50 text-rose-800 border-rose-200'
      );
    }

    function hideBanner(el) {
      el.classList.add('hidden');
      el.textContent = '';
    }

    function getToken() {
      return localStorage.getItem(TOKEN_KEY) || '';
    }

    function authHeaders() {
      const token = getToken();
      return {
        'Content-Type': 'application/json',
        ...(token ? { Authorization: `Bearer ${token}` } : {}),
      };
    }

    function setAuthMode(mode) {
      authMode = mode;
      hideBanner(authAlert);
      const isSignup = mode === 'signup';
      nameFieldGroup.classList.toggle('hidden', !isSignup);
      authSubmitBtn.textContent = isSignup ? 'Create Account' : 'Login';

      modeLoginBtn.className = !isSignup
        ? 'py-1.5 rounded-md text-sm font-medium bg-indigo-600 text-white cursor-pointer'
        : 'py-1.5 rounded-md text-sm font-medium text-slate-700 hover:text-slate-900 cursor-pointer';
      modeSignupBtn.className = isSignup
        ? 'py-1.5 rounded-md text-sm font-medium bg-indigo-600 text-white cursor-pointer'
        : 'py-1.5 rounded-md text-sm font-medium text-slate-700 hover:text-slate-900 cursor-pointer';
    }

    function showLoggedOut() {
      localStorage.removeItem(TOKEN_KEY);
      userBar.classList.add('hidden');
      notesView.classList.add('hidden');
      authView.classList.remove('hidden');
      resetNoteForm();
      currentNotes = [];
    }

    function showLoggedIn(user) {
      userNameLabel.textContent = user.name;
      userEmailLabel.textContent = `(${user.email})`;
      userBar.classList.remove('hidden');
      authView.classList.add('hidden');
      notesView.classList.remove('hidden');
      loadNotes();
    }

    function resetNoteForm() {
      noteForm.reset();
      noteIdInput.value = '';
      noteCategoryInput.value = 'General';
      noteFormTitle.textContent = 'Create Note';
      saveNoteBtn.textContent = 'Save Note';
      editBadge.classList.add('hidden');
      cancelEditBtn.classList.add('hidden');
    }

    function enterEditMode(note) {
      hideBanner(noteAlert);
      noteIdInput.value = note._id;
      noteTitleInput.value = note.title;
      noteCategoryInput.value = note.category || 'General';
      noteContentInput.value = note.content;

      noteFormTitle.textContent = 'Edit Note';
      saveNoteBtn.textContent = 'Update Note';
      editBadge.classList.remove('hidden');
      cancelEditBtn.classList.remove('hidden');
      noteTitleInput.focus();
    }

    function renderNotes(notes) {
      notesCountLabel.textContent = `Showing ${notes.length} note(s) owned by you`;

      if (notes.length === 0) {
        notesGrid.innerHTML = `
          <div class="md:col-span-2 bg-white border border-slate-200 rounded-xl p-8 text-center text-sm text-slate-500">
            No notes found. Create your first private note using the form.
          </div>
        `;
        return;
      }

      notesGrid.innerHTML = notes
        .map((note) => `
          <article class="bg-white border border-slate-200 rounded-xl shadow-sm p-5 flex flex-col justify-between gap-3">
            <div>
              <div class="flex items-center justify-between gap-2 mb-2">
                <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-indigo-50 text-indigo-700">
                  ${escapeHtml(note.category || 'General')}
                </span>
                <span class="text-xs text-slate-400">
                  ${escapeHtml(new Date(note.updatedAt).toLocaleDateString())}
                </span>
              </div>
              <h3 class="text-base font-semibold text-slate-900">${escapeHtml(note.title)}</h3>
              <p class="text-sm text-slate-600 mt-2 whitespace-pre-line leading-relaxed">${escapeHtml(note.content)}</p>
            </div>

            <div class="pt-3 border-t border-slate-100 flex items-center justify-end gap-2">
              <button
                type="button"
                data-action="edit"
                data-id="${escapeHtml(note._id)}"
                class="text-indigo-600 hover:text-indigo-800 font-medium text-xs px-2.5 py-1 rounded-md border border-indigo-200 hover:bg-indigo-50 cursor-pointer"
              >
                Edit
              </button>
              <button
                type="button"
                data-action="delete"
                data-id="${escapeHtml(note._id)}"
                class="text-rose-600 hover:text-rose-800 font-medium text-xs px-2.5 py-1 rounded-md border border-rose-200 hover:bg-rose-50 cursor-pointer"
              >
                Delete
              </button>
            </div>
          </article>
        `)
        .join('');
    }

    async function loadNotes() {
      try {
        hideBanner(listAlert);
        const q = searchInput.value.trim();
        const url = q ? `/api/notes?q=${encodeURIComponent(q)}` : '/api/notes';
        const res = await fetch(url, { headers: authHeaders() });
        const data = await res.json();

        if (res.status === 401) {
          showLoggedOut();
          showBanner(authAlert, data.error || 'Please log in again.', 'error');
          return;
        }
        if (!res.ok) throw new Error(data.error || 'Failed to load notes.');

        currentNotes = data;
        renderNotes(currentNotes);
      } catch (err) {
        showBanner(listAlert, err.message, 'error');
      }
    }

    modeLoginBtn.addEventListener('click', () => setAuthMode('login'));
    modeSignupBtn.addEventListener('click', () => setAuthMode('signup'));

    document.querySelectorAll('button[data-demo-email]').forEach((btn) => {
      btn.addEventListener('click', () => {
        setAuthMode('login');
        authEmailInput.value = btn.dataset.demoEmail;
        authPasswordInput.value = 'pass123';
      });
    });

    authForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideBanner(authAlert);

      const email = authEmailInput.value.trim();
      const password = authPasswordInput.value;
      const name = authNameInput.value.trim();

      if (authMode === 'signup' && !name) {
        showBanner(authAlert, 'Full name is required to sign up.', 'error');
        return;
      }
      if (!email || !password) {
        showBanner(authAlert, 'Email and password are required.', 'error');
        return;
      }

      authSubmitBtn.disabled = true;

      try {
        const endpoint = authMode === 'signup' ? '/api/auth/signup' : '/api/auth/login';
        const body = authMode === 'signup' ? { name, email, password } : { email, password };

        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Authentication failed.');

        localStorage.setItem(TOKEN_KEY, data.token);
        authForm.reset();
        showLoggedIn(data.user);
      } catch (err) {
        showBanner(authAlert, err.message, 'error');
      } finally {
        authSubmitBtn.disabled = false;
      }
    });

    logoutBtn.addEventListener('click', () => {
      showLoggedOut();
      showBanner(authAlert, 'Logged out successfully.', 'success');
    });

    noteForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideBanner(noteAlert);

      const id = noteIdInput.value;
      const payload = {
        title: noteTitleInput.value.trim(),
        category: noteCategoryInput.value.trim() || 'General',
        content: noteContentInput.value.trim(),
      };

      if (!payload.title || !payload.content) {
        showBanner(noteAlert, 'Title and Content are required.', 'error');
        return;
      }

      saveNoteBtn.disabled = true;

      try {
        const res = await fetch(id ? `/api/notes/${encodeURIComponent(id)}` : '/api/notes', {
          method: id ? 'PUT' : 'POST',
          headers: authHeaders(),
          body: JSON.stringify(payload),
        });
        const data = await res.json();

        if (res.status === 401) {
          showLoggedOut();
          showBanner(authAlert, data.error || 'Please log in again.', 'error');
          return;
        }
        if (!res.ok) throw new Error(data.error || 'Failed to save note.');

        resetNoteForm();
        showBanner(noteAlert, id ? 'Note updated.' : 'Note saved.', 'success');
        await loadNotes();
      } catch (err) {
        showBanner(noteAlert, err.message, 'error');
      } finally {
        saveNoteBtn.disabled = false;
      }
    });

    cancelEditBtn.addEventListener('click', () => {
      resetNoteForm();
      hideBanner(noteAlert);
    });

    notesGrid.addEventListener('click', async (e) => {
      const btn = e.target.closest('button[data-action]');
      if (!btn) return;

      const { action, id } = btn.dataset;
      const note = currentNotes.find((n) => n._id === id);
      if (!note) return;

      if (action === 'edit') {
        enterEditMode(note);
        return;
      }

      if (action === 'delete') {
        if (!confirm(`Delete "${note.title}"?`)) return;
        hideBanner(listAlert);

        try {
          const res = await fetch(`/api/notes/${encodeURIComponent(id)}`, {
            method: 'DELETE',
            headers: authHeaders(),
          });
          const data = await res.json();

          if (res.status === 401) {
            showLoggedOut();
            return;
          }
          if (!res.ok) throw new Error(data.error || 'Failed to delete note.');

          if (noteIdInput.value === id) resetNoteForm();
          showBanner(listAlert, 'Note deleted.', 'success');
          await loadNotes();
        } catch (err) {
          showBanner(listAlert, err.message, 'error');
        }
      }
    });

    searchInput.addEventListener('input', () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(loadNotes, 150);
    });

    async function checkExistingSession() {
      const token = getToken();
      if (!token) {
        showLoggedOut();
        return;
      }

      try {
        const res = await fetch('/api/auth/me', { headers: authHeaders() });
        const data = await res.json();
        if (!res.ok) throw new Error('Invalid session');
        showLoggedIn(data.user);
      } catch {
        showLoggedOut();
      }
    }

    checkExistingSession();
  </script>
</body>
</html>
