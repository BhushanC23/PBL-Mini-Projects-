<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Records Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <header class="bg-white border-b border-slate-200">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-4 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2">
      <div>
        <h1 class="text-xl font-bold text-slate-900">Student Records Portal</h1>
        <p class="text-sm text-slate-500">Manage student profiles, marks, and Pass/Fail status (Pass &ge; 40 marks)</p>
      </div>
      <div class="flex items-center gap-3 text-sm">
        <span class="px-3 py-1 rounded-full bg-slate-100 text-slate-700 font-medium">
          Total: <strong id="totalCount">0</strong>
        </span>
        <span class="px-3 py-1 rounded-full bg-emerald-50 text-emerald-700 font-medium border border-emerald-200">
          Pass: <strong id="passCount">0</strong>
        </span>
        <span class="px-3 py-1 rounded-full bg-rose-50 text-rose-700 font-medium border border-rose-200">
          Fail: <strong id="failCount">0</strong>
        </span>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 sm:px-6 py-6 grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
    <!-- Add / Update Student Form -->
    <section class="lg:col-span-4 bg-white border border-slate-200 rounded-xl shadow-sm p-5">
      <div class="flex items-center justify-between mb-4">
        <h2 id="formTitle" class="text-base font-semibold text-slate-900">Add Student</h2>
        <span id="editBadge" class="hidden text-xs font-medium px-2.5 py-0.5 rounded-full bg-indigo-50 text-indigo-700 border border-indigo-200">
          Editing Mode
        </span>
      </div>

      <div id="alertBox" class="hidden mb-4 rounded-lg px-3.5 py-2.5 text-sm border" role="alert"></div>

      <form id="studentForm" class="space-y-3.5" novalidate>
        <input type="hidden" id="studentId" />

        <div>
          <label for="rollNo" class="block text-sm font-medium text-slate-700 mb-1">Roll No.</label>
          <input
            type="text"
            id="rollNo"
            placeholder="e.g. CS106"
            required
            class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 uppercase"
          />
        </div>

        <div>
          <label for="name" class="block text-sm font-medium text-slate-700 mb-1">Full Name</label>
          <input
            type="text"
            id="name"
            placeholder="e.g. Ananya Deshmukh"
            required
            class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
          />
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label for="studentClass" class="block text-sm font-medium text-slate-700 mb-1">Class</label>
            <input
              type="text"
              id="studentClass"
              placeholder="e.g. TY-CS"
              required
              class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
            />
          </div>

          <div>
            <label for="marks" class="block text-sm font-medium text-slate-700 mb-1">Marks (0–100)</label>
            <input
              type="number"
              id="marks"
              min="0"
              max="100"
              step="1"
              placeholder="0 - 100"
              required
              class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
            />
          </div>
        </div>

        <div>
          <label for="email" class="block text-sm font-medium text-slate-700 mb-1">Email</label>
          <input
            type="email"
            id="email"
            placeholder="e.g. ananya@college.edu"
            required
            class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
          />
        </div>

        <div class="pt-1 flex items-center gap-2">
          <button
            type="submit"
            id="submitBtn"
            class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm px-4 py-2.5 rounded-lg transition-colors cursor-pointer"
          >
            Add Student
          </button>
          <button
            type="button"
            id="cancelEditBtn"
            class="hidden px-4 py-2.5 rounded-lg border border-slate-300 text-slate-700 hover:bg-slate-100 font-medium text-sm transition-colors cursor-pointer"
          >
            Cancel
          </button>
        </div>
      </form>
    </section>

    <!-- Student Directory Table -->
    <section class="lg:col-span-8 bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden">
      <div class="p-5 border-b border-slate-200 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
        <div>
          <h2 class="text-base font-semibold text-slate-900">Student Directory</h2>
          <p id="resultSummary" class="text-xs text-slate-500 mt-0.5">Loading records...</p>
        </div>

        <div class="relative w-full sm:w-72">
          <input
            type="search"
            id="searchInput"
            placeholder="Search roll no, name, class, email..."
            aria-label="Search students"
            class="w-full rounded-lg border border-slate-300 pl-3 pr-8 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
          />
          <button
            type="button"
            id="clearSearchBtn"
            title="Clear search"
            class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 text-sm font-semibold cursor-pointer"
          >
            &times;
          </button>
        </div>
      </div>

      <div id="tableBanner" class="hidden mx-5 mt-4 rounded-lg px-3.5 py-2.5 text-sm border"></div>

      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-50 border-b border-slate-200 text-xs font-semibold uppercase tracking-wider text-slate-500">
              <th class="px-4 py-3">Roll No.</th>
              <th class="px-4 py-3">Name</th>
              <th class="px-4 py-3">Class</th>
              <th class="px-4 py-3">Email</th>
              <th class="px-4 py-3 text-right">Marks</th>
              <th class="px-4 py-3 text-center">Result</th>
              <th class="px-4 py-3 text-right">Actions</th>
            </tr>
          </thead>
          <tbody id="studentTableBody" class="divide-y divide-slate-200 text-sm"></tbody>
        </table>
      </div>

      <div id="emptyState" class="hidden py-10 px-4 text-center text-sm text-slate-500">
        No matching student records found.
      </div>
    </section>
  </main>

  <script>
    const PASS_MARKS = 40;

    const studentForm = document.getElementById('studentForm');
    const studentIdInput = document.getElementById('studentId');
    const rollNoInput = document.getElementById('rollNo');
    const nameInput = document.getElementById('name');
    const classInput = document.getElementById('studentClass');
    const marksInput = document.getElementById('marks');
    const emailInput = document.getElementById('email');

    const formTitle = document.getElementById('formTitle');
    const editBadge = document.getElementById('editBadge');
    const submitBtn = document.getElementById('submitBtn');
    const cancelEditBtn = document.getElementById('cancelEditBtn');
    const alertBox = document.getElementById('alertBox');
    const tableBanner = document.getElementById('tableBanner');

    const searchInput = document.getElementById('searchInput');
    const clearSearchBtn = document.getElementById('clearSearchBtn');
    const studentTableBody = document.getElementById('studentTableBody');
    const emptyState = document.getElementById('emptyState');
    const resultSummary = document.getElementById('resultSummary');
    const totalCount = document.getElementById('totalCount');
    const passCount = document.getElementById('passCount');
    const failCount = document.getElementById('failCount');

    let currentStudents = [];
    let searchTimer = null;

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = String(text ?? '');
      return div.innerHTML;
    }

    function showAlert(target, message, type = 'error') {
      target.textContent = message;
      target.className = 'rounded-lg px-3.5 py-2.5 text-sm border ' + (
        target === alertBox ? 'mb-4 ' : 'mx-5 mt-4 '
      ) + (
        type === 'success'
          ? 'bg-emerald-50 text-emerald-800 border-emerald-200'
          : 'bg-rose-50 text-rose-800 border-rose-200'
      );
    }

    function hideAlert(target) {
      target.classList.add('hidden');
      target.textContent = '';
    }

    function resetFormMode() {
      studentForm.reset();
      studentIdInput.value = '';
      formTitle.textContent = 'Add Student';
      submitBtn.textContent = 'Add Student';
      editBadge.classList.add('hidden');
      cancelEditBtn.classList.add('hidden');
    }

    function enterEditMode(student) {
      hideAlert(alertBox);
      studentIdInput.value = student._id;
      rollNoInput.value = student.rollNo;
      nameInput.value = student.name;
      classInput.value = student.studentClass;
      marksInput.value = student.marks;
      emailInput.value = student.email;

      formTitle.textContent = 'Update Student';
      submitBtn.textContent = 'Update Student';
      editBadge.classList.remove('hidden');
      cancelEditBtn.classList.remove('hidden');
      rollNoInput.focus();
    }

    function updateSummary(students, query) {
      const passed = students.filter((s) => Number(s.marks) >= PASS_MARKS).length;
      const failed = students.length - passed;

      totalCount.textContent = students.length;
      passCount.textContent = passed;
      failCount.textContent = failed;

      resultSummary.textContent = query
        ? `Showing ${students.length} result(s) for "${query}"`
        : `Showing ${students.length} student record(s)`;
    }

    function renderTable(students) {
      const query = searchInput.value.trim();
      updateSummary(students, query);

      if (students.length === 0) {
        studentTableBody.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');
      studentTableBody.innerHTML = students
        .map((student) => {
          const isPass = Number(student.marks) >= PASS_MARKS;
          const badgeClass = isPass
            ? 'bg-emerald-50 text-emerald-700 border-emerald-200'
            : 'bg-rose-50 text-rose-700 border-rose-200';
          const badgeLabel = isPass ? 'Pass' : 'Fail';

          return `
            <tr class="hover:bg-slate-50 transition-colors">
              <td class="px-4 py-3 font-semibold text-slate-900 whitespace-nowrap">${escapeHtml(student.rollNo)}</td>
              <td class="px-4 py-3 text-slate-800 whitespace-nowrap">${escapeHtml(student.name)}</td>
              <td class="px-4 py-3 text-slate-600 whitespace-nowrap">${escapeHtml(student.studentClass)}</td>
              <td class="px-4 py-3 text-slate-600 whitespace-nowrap">${escapeHtml(student.email)}</td>
              <td class="px-4 py-3 text-right font-medium text-slate-900 whitespace-nowrap">${escapeHtml(student.marks)} / 100</td>
              <td class="px-4 py-3 text-center whitespace-nowrap">
                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold border ${badgeClass}">
                  ${badgeLabel}
                </span>
              </td>
              <td class="px-4 py-3 text-right whitespace-nowrap space-x-2">
                <button
                  type="button"
                  data-action="edit"
                  data-id="${escapeHtml(student._id)}"
                  class="text-indigo-600 hover:text-indigo-800 font-medium text-xs px-2.5 py-1 rounded-md border border-indigo-200 hover:bg-indigo-50 cursor-pointer"
                >
                  Edit
                </button>
                <button
                  type="button"
                  data-action="delete"
                  data-id="${escapeHtml(student._id)}"
                  class="text-rose-600 hover:text-rose-800 font-medium text-xs px-2.5 py-1 rounded-md border border-rose-200 hover:bg-rose-50 cursor-pointer"
                >
                  Delete
                </button>
              </td>
            </tr>
          `;
        })
        .join('');
    }

    async function fetchStudents() {
      try {
        hideAlert(tableBanner);
        const query = searchInput.value.trim();
        const url = query ? `/api/students?q=${encodeURIComponent(query)}` : '/api/students';
        const res = await fetch(url);
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Failed to load student records.');
        }

        currentStudents = data;
        renderTable(currentStudents);
      } catch (err) {
        showAlert(tableBanner, err.message, 'error');
      }
    }

    function validateClientForm() {
      const rollNo = rollNoInput.value.trim();
      const name = nameInput.value.trim();
      const studentClass = classInput.value.trim();
      const marksRaw = marksInput.value.trim();
      const email = emailInput.value.trim();

      if (!rollNo || !name || !studentClass || !marksRaw || !email) {
        return 'All fields (Roll No., Name, Class, Marks, Email) are required.';
      }

      const marks = Number(marksRaw);
      if (Number.isNaN(marks) || marks < 0 || marks > 100) {
        return 'Marks must be a number between 0 and 100.';
      }

      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        return 'Please enter a valid email address.';
      }

      return null;
    }

    studentForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert(alertBox);

      const clientError = validateClientForm();
      if (clientError) {
        showAlert(alertBox, clientError, 'error');
        return;
      }

      const id = studentIdInput.value;
      const payload = {
        rollNo: rollNoInput.value.trim(),
        name: nameInput.value.trim(),
        studentClass: classInput.value.trim(),
        marks: Number(marksInput.value),
        email: emailInput.value.trim(),
      };

      submitBtn.disabled = true;

      try {
        const res = await fetch(id ? `/api/students/${encodeURIComponent(id)}` : '/api/students', {
          method: id ? 'PUT' : 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Could not save student record.');
        }

        resetFormMode();
        showAlert(
          alertBox,
          id ? 'Student record updated successfully.' : 'Student record added successfully.',
          'success'
        );
        await fetchStudents();
      } catch (err) {
        showAlert(alertBox, err.message, 'error');
      } finally {
        submitBtn.disabled = false;
      }
    });

    cancelEditBtn.addEventListener('click', () => {
      resetFormMode();
      hideAlert(alertBox);
    });

    studentTableBody.addEventListener('click', async (e) => {
      const btn = e.target.closest('button[data-action]');
      if (!btn) return;

      const { action, id } = btn.dataset;
      const student = currentStudents.find((s) => s._id === id);
      if (!student) return;

      if (action === 'edit') {
        enterEditMode(student);
        return;
      }

      if (action === 'delete') {
        if (!confirm(`Delete student ${student.name} (${student.rollNo})?`)) {
          return;
        }

        try {
          hideAlert(tableBanner);
          const res = await fetch(`/api/students/${encodeURIComponent(id)}`, {
            method: 'DELETE',
          });
          const data = await res.json();

          if (!res.ok) {
            throw new Error(data.error || 'Failed to delete student.');
          }

          if (studentIdInput.value === id) {
            resetFormMode();
          }
          showAlert(tableBanner, `Deleted ${student.name} (${student.rollNo}).`, 'success');
          await fetchStudents();
        } catch (err) {
          showAlert(tableBanner, err.message, 'error');
        }
      }
    });

    searchInput.addEventListener('input', () => {
      clearSearchBtn.classList.toggle('hidden', !searchInput.value.trim());
      clearTimeout(searchTimer);
      searchTimer = setTimeout(fetchStudents, 150);
    });

    clearSearchBtn.addEventListener('click', () => {
      searchInput.value = '';
      clearSearchBtn.classList.add('hidden');
      fetchStudents();
      searchInput.focus();
    });

    fetchStudents();
  </script>
</body>
</html>
